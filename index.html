<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Beat the Burn</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Beat the Burn</h1>
    <textarea id='text-input' name='text-input' rows='10'></textarea>
    <section id='controls-section'>
      <span id='left-controls'>
        <button id='start-button'></button>
        <button id='unburn-button'></button>
        <span>Words per minute: <input id='wpm-input' type='number' /></span>
      </span>
      <button id='reset-button'></button>
    </section>
    <article>
      <p id='text-to-read'></p>
    </article>
    <script src="index.js"></script>
  </body>
</html>
